name: tk_music
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Textos propios de Flutter (copiar/pegar, "Atrás", "Cerrar"…) en español.
  flutter_localizations:
    sdk: flutter
  # @immutable en las entidades del dominio sin depender de Flutter.
  meta: ^1.16.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  device_info_plus: ^11.3.0
  on_audio_query_forked: ^2.9.1
  permission_handler: ^12.0.0
  shared_preferences: ^2.5.3
  get_it: ^8.0.3
  # Para el botón de contacto de la pantalla "Acerca de" (abre el correo).
  url_launcher: ^6.3.1
  # Cachea las carátulas en disco para poder pasarlas a la notificación.
  path_provider: ^2.1.5
  # Reporta crashes reales de usuarios (Java/Kotlin y nativos) a la consola
  # de Firebase — para casos como "se instala pero no abre en tal equipo"
  # que no se pueden diagnosticar sin un log del dispositivo de otra
  # persona.
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.2.0
  # Reproductor para desktop (Windows/Linux/macOS) — just_audio no tiene
  # soporte sólido ahí. Android/iOS se quedan con just_audio tal cual; esto
  # solo lo usa DesktopAudioHandler.
  media_kit: ^1.1.11
  # Solo las libs nativas de desktop: el meta-paquete media_kit_libs_audio
  # también metía libmpv en el APK de Android, donde no se usa.
  # Ojo: esta libmpv trae FFmpeg recortado; de sus filtros de audio solo
  # tiene `equalizer` (sin bass/treble/pan/volume). El Modo DJ arma todo
  # con eso (ver DjDeck).
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_audio: ^1.1.4
  # Selector de carpeta/archivos multiplataforma — en desktop no existe un
  # equivalente a MediaStore, así que la biblioteca ahí se arma escaneando
  # una carpeta elegida a mano.
  file_picker: ^8.1.2
  # Decodificar/redimensionar/codificar a JPEG las carátulas que se eligen en
  # el editor de tags (Dart puro, sin código nativo).
  image: ^4.2.0
  path: ^1.9.0
  # "Unirse con QR" en Sincronizar con otro dispositivo: el anfitrión
  # muestra el código (qr_flutter, Dart puro) y el invitado lo escanea con
  # la cámara — mobile_scanner en Android; en Windows no existe, así que se
  # toma la imagen con camera_windows y se decodifica con zxing2 (Dart puro).
  # camera_windows fijo en 0.2.6+4: la siguiente pide Flutter 3.38.
  qr_flutter: ^4.1.0
  # Alguna dependencia usa íconos Cupertino; sin esta fuente, el build de
  # release avisa "Expected to find fonts for ... CupertinoIcons". En el APK
  # solo quedan los íconos que se usan.
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.0.0
  zxing2: ^0.2.4
  camera_platform_interface: ^2.6.0
  camera_windows: 0.2.6+4

dependency_overrides:
  # on_audio_query_forked 2.9.1 declara mal su default_package de Android
  # (apunta a "on_audio_query_android", que no existe; la implementación real
  # que usa es "on_audio_query_android_v1_8"). Eso genera un warning en cada
  # comando de Flutter. Se usa una copia local con esa única línea corregida
  # en vez de la de pub.dev. Ver packages/on_audio_query_forked/README_PATCH.md.
  on_audio_query_forked:
    path: packages/on_audio_query_forked

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pruebas dentro de la app real (con los plugins nativos de Windows).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

