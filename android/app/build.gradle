plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.tkmusic.app"
    // 36: lo exige media_kit (plugins compilados contra SDK 36). Es solo el
    // SDK de compilación, es retrocompatible; targetSdk sigue en 35.
    compileSdkVersion 36
    // 27: lo piden audio_service, firebase, mobile_scanner y otros plugins
    // (el NDK es retrocompatible; el de Flutter 3.32 por defecto es el 26).
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.tkmusic.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    def keyPropertiesFile = rootProject.file('key.properties')
    def keyProperties = new Properties()
    if (keyPropertiesFile.exists()) {
        keyPropertiesFile.withInputStream { keyProperties.load(it) }
        signingConfigs {
            release {
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
                storeFile rootProject.file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // R8 sin reglas de keep para audio_service/media3 (ExoPlayer)
            // rompe la carga de audio en release: NullPointerException al
            // llamar setAudioSources porque poda clases usadas por
            // reflexión. Desactivado hasta tener proguard-rules.pro
            // completas para esas dependencias.
            minifyEnabled false
            shrinkResources false
        }
    }

    // Sube los símbolos nativos (.so) para que un crash nativo (por ejemplo
    // una librería que falla al cargar en equipos con páginas de memoria
    // de 16KB) se vea legible en la consola de Firebase en vez de
    // direcciones de memoria crudas.
    firebaseCrashlytics {
        nativeSymbolUploadEnabled true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    // Componente NDK: sin esto, Crashlytics solo ve crashes Java/Kotlin —
    // uno nativo (dlopen fallando al cargar un .so, por ejemplo) no
    // pasaría por el manejador de excepciones de Java y quedaría invisible.
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
}
