pluginManagement {
    def properties = new Properties()
    file("local.properties").withInputStream { properties.load(it) }
    def flutterSdkPath = properties.getProperty("flutter.sdk")
    assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 8.9.1: lo pide CameraX 1.6 (lector de QR de "Unirse con QR"); además
    // soporta oficialmente compileSdk 36.
    id "com.android.application" version "8.9.1" apply false
    // 2.2.20: mobile_scanner (lector de QR) y CameraX 1.6 vienen compilados
    // con Kotlin 2.2; el 1.9 no puede leerlos ("incompatible version of
    // Kotlin... metadata version is 2.2.0").
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    // Firebase Crashlytics: requieren android/app/google-services.json
    // (generado desde la consola de Firebase para applicationId
    // "com.tkmusic.app") — sin ese archivo el build falla con
    // "File google-services.json is missing".
    id "com.google.gms.google-services" version "4.4.2" apply false
    id "com.google.firebase.crashlytics" version "3.0.2" apply false
}

include ":app"
